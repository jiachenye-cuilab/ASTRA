name: Source checkout CPU checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-section.txt
          python -m pip check
      - name: Test source checkout
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
        run: |
          python -B -m unittest discover -s tests -v
      - name: Explicit bundled pretrained CPU replay
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '2'
          ASTRA_RUN_BUNDLED: '1'
        run: |
          python -B -m unittest discover -s tests -k Bundled -v
